<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MekaIdle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Character creation and login -->
  <div class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="brand brand-big"><span class="brand-mark" aria-hidden="true"></span><span>MEKA<b>IDLE</b></span></div>
      <p class="auth-sub">Build a mech, train while you’re away, and raid with your guild.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-create" aria-selected="true" aria-controls="form-create">Create character</button>
        <button type="button" role="tab" class="tab" id="tab-login" aria-selected="false" aria-controls="form-login">Log in</button>
      </div>

      <form class="auth-form" id="form-create" role="tabpanel" aria-labelledby="tab-create" novalidate>
        <div class="auth-split">
          <div class="auth-fields">
            <label class="field">Pilot name
              <input name="name" autocomplete="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" spellcheck="false">
              <small>3–16 letters, numbers or underscores. Other players see this.</small>
            </label>
            <label class="field">Password
              <input name="password" type="password" autocomplete="new-password" required minlength="8">
              <small>At least 8 characters.</small>
            </label>
            <label class="field">Mech name
              <input name="mech" required maxlength="24" placeholder="e.g. Rustbucket">
            </label>
            <fieldset class="field paints">
              <legend>Paint</legend>
              <div class="swatches" id="paints"></div>
            </fieldset>
          </div>
          <div class="auth-preview" id="create-preview"></div>
        </div>
        <p class="form-error" id="create-error" role="alert"></p>
        <button class="btn primary wide" type="submit">Create character</button>
      </form>

      <form class="auth-form" id="form-login" role="tabpanel" aria-labelledby="tab-login" hidden novalidate>
        <label class="field">Pilot name
          <input name="name" autocomplete="username" required spellcheck="false">
        </label>
        <label class="field">Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn primary wide" type="submit">Log in</button>
      </form>
    </div>
  </div>

  <!-- The game -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>MEKA<b>IDLE</b></span></div>
      <div class="now-card" id="now-card"></div>
      <nav class="nav" id="nav" aria-label="Game sections"></nav>
      <button type="button" class="nav-item logout" id="logout"></button>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <div class="wallet" id="wallet"></div>
        <div class="pilot" id="pilot"></div>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="icon-btn modal-close" id="modal-close" aria-label="Close"></button>
      <div id="modal-body"></div>
    </div>
  </div>

  <template id="mech-template">
    <svg class="mech" viewBox="0 0 320 350" role="img" aria-label="Your mech">
      <ellipse class="floor" cx="160" cy="328" rx="118" ry="9"/>
      <g class="m-legs part">
        <rect x="116" y="198" width="30" height="106" rx="3"/>
        <rect x="174" y="198" width="30" height="106" rx="3"/>
        <rect class="joint" x="120" y="246" width="22" height="12"/>
        <rect class="joint" x="178" y="246" width="22" height="12"/>
        <rect x="104" y="304" width="50" height="16" rx="2"/>
        <rect x="166" y="304" width="50" height="16" rx="2"/>
      </g>
      <g class="m-body">
        <rect x="150" y="74" width="20" height="14"/>
        <rect x="134" y="38" width="52" height="38" rx="6"/>
        <rect class="visor" x="142" y="52" width="36" height="9" rx="2"/>
        <path d="M100 86 H220 L232 176 H88 Z"/>
        <rect x="112" y="174" width="96" height="26" rx="3"/>
      </g>
      <g class="m-weapon part">
        <rect x="60" y="98" width="28" height="92" rx="4"/>
        <rect x="232" y="98" width="28" height="92" rx="4"/>
        <rect class="joint" x="64" y="140" width="20" height="10"/>
        <rect class="joint" x="236" y="140" width="20" height="10"/>
        <rect class="barrel" x="63" y="190" width="9" height="32" rx="1"/>
        <rect class="barrel" x="76" y="190" width="9" height="24" rx="1"/>
        <rect class="barrel" x="248" y="190" width="9" height="32" rx="1"/>
        <rect class="barrel" x="235" y="190" width="9" height="24" rx="1"/>
      </g>
      <g class="m-armour part">
        <rect x="54" y="84" width="40" height="24" rx="5"/>
        <rect x="226" y="84" width="40" height="24" rx="5"/>
        <path d="M106 94 H138 V150 H112 Z M214 94 H182 V150 H208 Z"/>
        <path d="M146 38 L160 22 L174 38 Z"/>
      </g>
      <g class="m-reactor part">
        <circle class="housing" cx="160" cy="124" r="19"/>
        <circle class="core" cx="160" cy="124" r="11"/>
      </g>
      <g class="m-module part">
        <rect x="148" y="180" width="24" height="12" rx="2"/>
      </g>
    </svg>
  </template>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
