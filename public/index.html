<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MekaIdle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Character creation and login -->
  <div class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="brand brand-big"><span class="brand-mark" aria-hidden="true"></span><span>MEKA<b>IDLE</b></span></div>
      <p class="auth-sub">Build a mech, train while you’re away, and raid with your guild.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-create" aria-selected="true" aria-controls="form-create">Create character</button>
        <button type="button" role="tab" class="tab" id="tab-login" aria-selected="false" aria-controls="form-login">Log in</button>
      </div>

      <form class="auth-form" id="form-create" role="tabpanel" aria-labelledby="tab-create" novalidate>
        <div class="auth-split">
          <div class="auth-fields">
            <label class="field">Pilot name
              <input name="name" autocomplete="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" spellcheck="false">
              <small>3–16 letters, numbers or underscores. Other players see this.</small>
            </label>
            <label class="field">Password
              <input name="password" type="password" autocomplete="new-password" required minlength="8">
              <small>At least 8 characters.</small>
            </label>
            <label class="field">Mech name
              <input name="mech" required maxlength="24" placeholder="e.g. Rustbucket">
              <small>Your mech’s colour comes from the class of the weapon you fit.</small>
            </label>
          </div>
          <div class="auth-preview" id="create-preview"></div>
        </div>
        <p class="form-error" id="create-error" role="alert"></p>
        <button class="btn primary wide" type="submit">Create character</button>
      </form>

      <form class="auth-form" id="form-login" role="tabpanel" aria-labelledby="tab-login" hidden novalidate>
        <label class="field">Pilot name
          <input name="name" autocomplete="username" required spellcheck="false">
        </label>
        <label class="field">Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn primary wide" type="submit">Log in</button>
      </form>
    </div>
  </div>

  <!-- The game -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>MEKA<b>IDLE</b></span></div>
      <div class="now-card" id="now-card"></div>
      <div class="queue-box" id="queue-box"></div>
      <nav class="nav" id="nav" aria-label="Game sections"></nav>
      <div class="side-foot">
        <div class="pilot-card" id="pilot"></div>
        <button type="button" class="nav-item logout" id="logout"></button>
        <button type="button" class="nav-item" id="credits-link"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <div class="topline" id="topline"></div>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="icon-btn modal-close" id="modal-close" aria-label="Close"></button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="gameicons.js"></script>
  <script src="icons.js"></script>
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
