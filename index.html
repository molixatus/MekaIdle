<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MekaIdle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>MekaIdle</h1>
    <div class="wallet" aria-live="off">
      <span class="scrap" id="scrap">0</span>
      <span class="scrap-label">scrap</span>
      <span class="rate" id="rate">+1.0 per second</span>
    </div>
  </header>

  <div class="notice" id="notice" hidden>
    <p id="notice-text"></p>
    <button type="button" class="ghost" id="notice-close">Dismiss</button>
  </div>

  <main class="layout">
    <section class="bay" aria-labelledby="bay-h">
      <h2 id="bay-h" class="visually-hidden">Mech bay</h2>
      <svg id="mech" viewBox="0 0 320 360" role="img" aria-labelledby="mech-title">
        <title id="mech-title">Your mech, showing its current upgrades</title>

        <g class="floor">
          <line x1="24" y1="330" x2="296" y2="330"/>
          <line x1="60" y1="342" x2="260" y2="342"/>
        </g>

        <g id="m-legs" class="part">
          <rect class="panel" x="116" y="198" width="30" height="106" rx="3"/>
          <rect class="panel" x="174" y="198" width="30" height="106" rx="3"/>
          <rect class="joint" x="120" y="246" width="22" height="12"/>
          <rect class="joint" x="178" y="246" width="22" height="12"/>
          <rect class="panel" x="104" y="304" width="50" height="16" rx="2"/>
          <rect class="panel" x="166" y="304" width="50" height="16" rx="2"/>
          <rect class="trim" data-min="5" x="120" y="208" width="5" height="32"/>
          <rect class="trim" data-min="5" x="195" y="208" width="5" height="32"/>
          <path class="panel" data-min="10" d="M104 304 l-12 16 h12z M216 304 l12 16 h-12z"/>
          <rect class="trim" data-min="15" x="120" y="266" width="22" height="4"/>
          <rect class="trim" data-min="15" x="178" y="266" width="22" height="4"/>
        </g>

        <g id="m-body" class="part">
          <rect class="panel" x="150" y="74" width="20" height="14"/>
          <rect class="panel" x="134" y="38" width="52" height="38" rx="6"/>
          <rect class="visor" x="142" y="52" width="36" height="9" rx="2"/>
          <path class="panel" d="M100 86 H220 L232 176 H88 Z"/>
          <rect class="panel" x="112" y="174" width="96" height="26" rx="3"/>
          <line class="seam" x1="160" y1="152" x2="160" y2="176"/>
        </g>

        <g id="m-arms" class="part">
          <rect class="panel" x="60" y="98" width="28" height="92" rx="4"/>
          <rect class="panel" x="232" y="98" width="28" height="92" rx="4"/>
          <rect class="joint" x="64" y="140" width="20" height="10"/>
          <rect class="joint" x="236" y="140" width="20" height="10"/>
          <rect class="barrel" data-min="1" x="64" y="190" width="7" height="24"/>
          <rect class="barrel" data-min="1" x="249" y="190" width="7" height="24"/>
          <rect class="barrel" data-min="5" x="77" y="190" width="7" height="32"/>
          <rect class="barrel" data-min="5" x="236" y="190" width="7" height="32"/>
          <rect class="panel" data-min="10" x="34" y="66" width="26" height="30" rx="3"/>
          <rect class="barrel" data-min="10" x="38" y="58" width="6" height="10"/>
          <rect class="barrel" data-min="10" x="50" y="58" width="6" height="10"/>
          <rect class="panel" data-min="15" x="260" y="66" width="26" height="30" rx="3"/>
          <rect class="barrel" data-min="15" x="264" y="58" width="6" height="10"/>
          <rect class="barrel" data-min="15" x="276" y="58" width="6" height="10"/>
        </g>

        <g id="m-armor" class="part">
          <rect class="plate" data-min="1" x="54" y="84" width="40" height="24" rx="5"/>
          <rect class="plate" data-min="1" x="226" y="84" width="40" height="24" rx="5"/>
          <path class="plate" data-min="5" d="M106 94 H138 V150 H112 Z M214 94 H182 V150 H208 Z"/>
          <path class="plate" data-min="10" d="M146 38 L160 22 L174 38 Z"/>
          <rect class="plate" data-min="15" x="112" y="200" width="38" height="30" rx="3"/>
          <rect class="plate" data-min="15" x="170" y="200" width="38" height="30" rx="3"/>
        </g>

        <g id="m-reactor" class="part">
          <circle class="housing" cx="160" cy="124" r="19"/>
          <circle class="core" id="core" cx="160" cy="124" r="10"/>
        </g>
      </svg>
      <p class="bay-caption" id="mech-summary">A bare frame. Train a skill to start upgrading it.</p>
    </section>

    <section class="panel-col upgrades" aria-labelledby="up-h">
      <h2 id="up-h">Upgrades</h2>
      <p class="hint">Each part levels up as far as its skill allows. Every part multiplies your scrap income.</p>
      <ul class="cards" id="parts"></ul>
    </section>

    <section class="panel-col skills" aria-labelledby="sk-h">
      <h2 id="sk-h">Training</h2>
      <p class="hint">Skills train on their own, even with the page closed. Queue up to five levels.</p>
      <ol class="queue" id="queue"></ol>
      <ul class="cards" id="skills"></ul>
    </section>
  </main>

  <footer class="footer">
    <ul class="log" id="log" aria-live="polite"></ul>
    <button type="button" class="ghost danger" id="wipe">Wipe save</button>
  </footer>

  <script src="game.js"></script>
</body>
</html>
